[project]
name = "tenet-py"
version = "0.1.0"
description = "Non-Abelian symmetric tensors with ndarray-style Python APIs and backend-native numerical execution"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "autoray>=0.10.1",
    "numpy>=2.0",
    "opt-einsum>=3.4.0",
    # SU(N) coefficients (F/R/CG with outer multiplicity) come from the racah Rust crate
    # through its PyO3 wheel; since M28 (#180) it is also the SU(2) source, so it is a
    # core dependency rather than an extra. >=0.1.2 is the first release binding racah's
    # *exact* SU(2) surface (racah#107/#108), which ``tenet.symmetry._su2_coeff`` calls
    # for F/R/B and the Frobenius-Schur indicator: ``su2_f_symbol``, ``su2_r_symbol``,
    # ``su2_frobenius_schur`` and ``su2_authority_fingerprint``. It is also the first
    # shipping ``racah.pyi`` and ``py.typed`` bar 0.1.1, which the `uvx ty check` CI gate
    # needs. Clebsch-Gordan tensors still come from the generated SU(N) surface in the
    # same wheel -- see ``_su2_coeff``'s docstring for why that split is where it is.
    "racah-py>=0.1.2",
]

[project.optional-dependencies]
jax = [
    # 0.10 is the first release with the wide-matrix qr JVP; below it, qr on a wide
    # sector and lq on a tall one raise NotImplementedError (#80).
    "jax>=0.10",
]
torch = [
    # Eager only: `tenet.ad` stays JAX-only, and `torch.compile` / `torch.func`
    # are out of scope (#95). See tests/backends/test_torch.py.
    "torch>=2.0",
]

# CPU wheels on linux. Measured on x86_64-unknown-linux-gnu: the default index
# resolves 24 packages, 13 of them NVIDIA CUDA wheels plus Triton; this index
# resolves 10, `torch==2.6.0+cpu`, zero NVIDIA wheels. macOS keeps the ordinary
# PyPI wheel, which is already CPU-only on arm64.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "jax>=0.10",  # wide-matrix qr JVP; see the [jax] extra (#80)
    "pytest>=8.0",
    # Coverage measurement for the CI badge (#145). No threshold gate: the number is
    # reported, not enforced.
    "pytest-cov>=6.0",
    # The suite is CPU-bound and embarrassingly parallel across modules. `--dist
    # loadfile` keeps a module on one worker, which the expensive modules rely on:
    # they converge an environment once and share it across their tests, and a
    # per-test split would re-pay every cold plan build.
    "pytest-xdist>=3.6",
    "quimb>=1.11",
    "ruff>=0.8",
    # NOT a core dependency: autoray's NumPy `linalg.expm` is `scipy.linalg.expm`, so
    # `tenet.linalg.expm` on a NumPy tensor needs it and raises an ImportError naming
    # `pip install scipy` without it (#86). Declared here — it already arrives
    # transitively via JAX and quimb — so the NumPy-backend expm tests run in CI.
    "scipy>=1.11",
]
# Docs only. Not a runtime or dev dependency: nothing in src/ or tests/ imports these,
# and the site is built by one CI step (#118). pymdownx arrives with mkdocs-material.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenet"]

[tool.ruff]
line-length = 100
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is CPU-bound and its modules are independent, so it runs on one worker
# per core. `loadfile` is the part that matters: the expensive modules converge an
# environment or build a plan once and share it across their own tests, and the
# default per-test distribution would re-pay every one of those cold builds on a
# different worker. The floor is therefore the slowest single *file*, which is what
# splitting the CTMRG lane in two was for: 517 s serial -> 208 s -> 139 s.
addopts = "-n auto --dist loadfile"

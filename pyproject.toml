[project]
name = "tenet-py"
version = "0.1.0"
description = "Non-Abelian symmetric tensors with ndarray-style Python APIs and backend-native numerical execution"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "autoray>=0.10.1",
    "numpy>=2.0",
    "opt-einsum>=3.4.0",
]

[project.optional-dependencies]
jax = [
    # 0.10 is the first release with the wide-matrix qr JVP; below it, qr on a wide
    # sector and lq on a tall one raise NotImplementedError (#80).
    "jax>=0.10",
]
torch = [
    # Eager only: `tenet.ad` stays JAX-only, and `torch.compile` / `torch.func`
    # are out of scope (#95). See tests/backends/test_torch.py.
    "torch>=2.0",
]

# CPU wheels on linux. Measured on x86_64-unknown-linux-gnu: the default index
# resolves 24 packages, 13 of them NVIDIA CUDA wheels plus Triton; this index
# resolves 10, `torch==2.6.0+cpu`, zero NVIDIA wheels. macOS keeps the ordinary
# PyPI wheel, which is already CPU-only on arm64.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "jax>=0.10",  # wide-matrix qr JVP; see the [jax] extra (#80)
    "pytest>=8.0",
    "quimb>=1.11",
    "ruff>=0.8",
    # NOT a core dependency: autoray's NumPy `linalg.expm` is `scipy.linalg.expm`, so
    # `tenet.linalg.expm` on a NumPy tensor needs it and raises an ImportError naming
    # `pip install scipy` without it (#86). Declared here — it already arrives
    # transitively via JAX and quimb — so the NumPy-backend expm tests run in CI.
    "scipy>=1.11",
]
# Docs only. Not a runtime or dev dependency: nothing in src/ or tests/ imports these,
# and the site is built by one CI step (#118). pymdownx arrives with mkdocs-material.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenet"]

[tool.ruff]
line-length = 100
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

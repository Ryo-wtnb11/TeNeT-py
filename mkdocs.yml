site_name: TeNeT-py
site_description: Non-Abelian symmetric tensors with ndarray-style Python APIs and backend-native numerical execution
site_url: https://ryo-wtnb11.github.io/TeNeT-py/
repo_url: https://github.com/Ryo-wtnb11/TeNeT-py
repo_name: Ryo-wtnb11/TeNeT-py
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Tensors, legs and spaces: guide/tensors-legs-spaces.md
      - Symmetries and providers: guide/symmetries-and-providers.md
      - Contraction: guide/contraction.md
      - Building a Hamiltonian: guide/hamiltonians.md
      - DMRG: guide/dmrg.md
      - Truncation: guide/truncation.md
      - JAX and backends: guide/jax-and-backends.md
      - Saving and loading: guide/saving-and-loading.md
  - Tutorials:
      - DMRG end to end: tutorials/dmrg.md
      - Fermions and the Hubbard model: tutorials/fermions.md
      - SU(2): tutorials/su2.md
      - Quantum chemistry: tutorials/quantum-chemistry.md
      - CTMRG: tutorials/ctmrg.md
      - VMC: tutorials/vmc.md
  - Examples:
      - examples/index.md
      - Examples:
          - Heisenberg, U(1): examples/heisenberg.md
          - Heisenberg, U(1) walkthrough: examples/heisenberg-walkthrough.md
          - Heisenberg, SU(2): examples/su2-heisenberg.md
          - 2D Ising CTMRG: examples/ising2d.md
      - Toy codes:
          - Toy MPS: examples/toy-mps.md
          - Toy model: examples/toy-model.md
          - Toy TEBD: examples/toy-tebd.md
          - Toy DMRG: examples/toy-dmrg.md
          - Toy Lanczos: examples/toy-lanczos.md
          - Toy exact: examples/toy-exact.md
          - Toy Ising: examples/toy-ising.md
          - Toy CTMRG: examples/toy-ctmrg.md
          - Toy VMC on an MPS: examples/toy-vmc-mps.md
  - API:
      - tenet: api/tenet.md
      - tenet.linalg: api/linalg.md
      - tenet.models: api/models.md
      - tenet.network: api/network.md
      - tenet.symmetry: api/symmetry.md
      - tenet.ad: api/ad.md
      - tenet.pytree: api/pytree.md
      - tenet.serialize: api/serialize.md
  - Design: design.md

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  # Line numbers on the toy-code source listings, which are whole files pulled in by
  # pymdownx.snippets and read as line-numbered listings rather than as snippets.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # docs/design.md writes its math blocks as GitHub's ```math fences; the custom fence
  # below routes them to arithmatex, so the file renders here unedited.
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic
              tag: div
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: table
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_if_no_docstring: false
            filters: ["!^_"]

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
